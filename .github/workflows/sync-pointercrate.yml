name: Sync Pointercrate Top 150
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pointercrate-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-pointercrate.mjs
      - name: Commit database update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/levels.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore: sync Pointercrate Top 150"; git push; fi
